<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KindSwap — Back Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

@keyframes mtn-twinkle {
  0%, 100% { opacity: .2; transform: scale(.8); }
  50%       { opacity: 1;  transform: scale(1.2); }
}
@keyframes mtn-orbit {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes mtn-orbit-rev {
  from { transform: rotate(360deg); }
  to   { transform: rotate(0deg); }
}
@keyframes mtn-spin-slow {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes mtn-shoot {
  0%   { transform: translate(-20px, -20px) rotate(35deg); opacity: 0; }
  10%  { opacity: 1; }
  60%  { opacity: 1; }
  100% { transform: translate(320px, 220px) rotate(35deg); opacity: 0; }
}
@keyframes mtn-pulse-soft {
  0%, 100% { opacity: .6; }
  50%       { opacity: 1; }
}
@keyframes mtn-status-fade {
  0%, 100% { opacity: .35; }
  50%       { opacity: .8; }
}

html, body {
  height: 100%;
  font-family: 'Sora', ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.page {
  min-height: 100vh;
  width: 100%;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(900px 500px at 70% 30%, rgba(71, 184, 224, 0.22), transparent 60%),
    radial-gradient(700px 400px at 20% 80%, rgba(34, 195, 142, 0.18), transparent 60%),
    rgb(6, 18, 28);
}

/* ── Particles ── */
.stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.star {
  position: absolute;
  border-radius: 50%;
}
.shoot {
  position: absolute;
  top: 20%;
  left: 10%;
  width: 64px;
  height: 1px;
  background: linear-gradient(to right, transparent, rgb(103, 232, 249), white);
  animation: mtn-shoot 7s linear 2s infinite;
}

/* ── Content ── */
.content {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 0 24px;
  max-width: 36rem;
  width: 100%;
}

/* ── Orbit system ── */
.orbit-system {
  position: relative;
  width: 224px;
  height: 224px;
  margin: 0 auto;
}
@media (min-width: 640px) {
  .orbit-system { width: 256px; height: 256px; }
}

.orbit-ring-outer {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid rgba(34, 211, 238, 0.2);
}
.orbit-ring-inner {
  position: absolute;
  top: 24px; left: 24px; right: 24px; bottom: 24px;
  border-radius: 50%;
  border: 1px solid rgba(52, 211, 153, 0.2);
}

.orbit-track-outer {
  position: absolute;
  inset: 0;
  animation: mtn-orbit 14s linear infinite;
}
.orbit-track-inner {
  position: absolute;
  top: 24px; left: 24px; right: 24px; bottom: 24px;
  animation: mtn-orbit-rev 10s linear infinite;
}

.planet-cyan {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background-color: rgb(103, 232, 249);
  box-shadow: rgb(29, 211, 211) 0 0 16px;
}
.planet-emerald {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background-color: rgb(110, 231, 183);
  box-shadow: rgb(34, 195, 142) 0 0 14px;
}

.center-orb-wrap {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.orb {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle, rgb(29, 211, 211), rgb(13, 58, 102));
  box-shadow: rgba(29, 211, 211, 0.55) 0 0 50px;
  animation: mtn-spin-slow 24s linear infinite;
}

/* ── Badge ── */
.badge {
  margin-top: 40px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px;
  border-radius: 9999px;
  border: 1px solid rgba(52, 211, 153, 0.3);
  background-color: rgba(52, 211, 153, 0.05);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgb(110, 231, 183);
  animation: mtn-pulse-soft 3s ease-in-out infinite;
}
.badge-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: rgb(110, 231, 183);
  flex-shrink: 0;
}

/* ── Heading ── */
h1 {
  margin-top: 16px;
  font-size: 2.25rem;
  font-weight: 700;
  color: white;
  letter-spacing: -0.025em;
  line-height: 1.15;
}
@media (min-width: 768px) { h1 { font-size: 3rem; } }

.subtitle {
  margin-top: 12px;
  color: rgba(203, 213, 225, 0.8);
  font-size: 15px;
  line-height: 1.625;
}
@media (min-width: 768px) { .subtitle { font-size: 1rem; } }

/* ── Status indicator ── */
.status-row {
  margin-top: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-size: 11px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: rgba(148, 163, 184, 0.55);
  animation: mtn-status-fade 2.4s ease-in-out infinite;
}
.status-pip {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background-color: rgb(110, 231, 183);
  flex-shrink: 0;
  animation: mtn-pulse-soft 2s ease-in-out infinite;
}

/* ── Footer ── */
.footer {
  position: absolute;
  bottom: 24px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgb(100, 116, 139);
}
</style>
</head>
<body>
<div class="page">

  <!-- Particles -->
  <div class="stars" aria-hidden="true">
    <div class="star" style="top:12%;left:8%;width:4px;height:4px;background:#fff;animation:mtn-twinkle 3s ease-in-out 0s infinite;"></div>
    <div class="star" style="top:22%;left:78%;width:6px;height:6px;background:rgb(165,243,252);animation:mtn-twinkle 2.5s ease-in-out .5s infinite;"></div>
    <div class="star" style="top:58%;left:18%;width:4px;height:4px;background:rgb(167,243,208);animation:mtn-twinkle 4s ease-in-out 1s infinite;"></div>
    <div class="star" style="top:72%;left:86%;width:4px;height:4px;background:#fff;animation:mtn-twinkle 3.2s ease-in-out .8s infinite;"></div>
    <div class="star" style="top:40%;left:48%;width:2px;height:2px;background:rgb(207,250,254);animation:mtn-twinkle 2s ease-in-out 0s infinite;"></div>
    <div class="star" style="top:82%;left:38%;width:4px;height:4px;background:#fff;animation:mtn-twinkle 3.6s ease-in-out .3s infinite;"></div>
    <div class="star" style="top:18%;left:40%;width:2px;height:2px;background:rgb(209,250,229);animation:mtn-twinkle 2.8s ease-in-out .6s infinite;"></div>
    <div class="star" style="top:68%;left:60%;width:4px;height:4px;background:rgb(165,243,252);animation:mtn-twinkle 3.4s ease-in-out 1.2s infinite;"></div>
    <div class="star" style="top:8%;left:60%;width:4px;height:4px;background:#fff;animation:mtn-twinkle 4.2s ease-in-out .4s infinite;"></div>
    <div class="shoot"></div>
  </div>

  <!-- Main content -->
  <div class="content">

    <!-- Orbit -->
    <div class="orbit-system" aria-hidden="true">
      <div class="orbit-ring-outer"></div>
      <div class="orbit-ring-inner"></div>

      <div class="orbit-track-outer">
        <div class="planet-cyan"></div>
      </div>

      <div class="orbit-track-inner">
        <div class="planet-emerald"></div>
      </div>

      <div class="center-orb-wrap">
        <div class="orb">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Badge -->
    <div class="badge">
      <span class="badge-dot"></span>
      Upgrading the kindverse
    </div>

    <h1>Aligning the stars</h1>

    <p class="subtitle">We're shipping something kinder. KindSwap will be back online shortly while we put the finishing touches on a smoother, faster experience.</p>

    <!-- Status / auto-refresh indicator -->
    <div class="status-row" role="status" aria-live="polite">
      <div class="status-pip"></div>
      <span id="status-text">Checking status…</span>
    </div>

  </div>

  <div class="footer" aria-label="KindSwap">KindSwap</div>
</div>

<script>
(function () {
  var REFRESH_SECS = 15;
  var countdown = REFRESH_SECS;
  var el = document.getElementById('status-text');

  function tick() {
    countdown -= 1;
    if (countdown <= 0) {
      el.textContent = 'Refreshing…';
      setTimeout(function () { location.reload(); }, 500);
      return;
    }
    el.textContent = 'Checking status in ' + countdown + 's…';
  }

  setInterval(tick, 1000);
}());
</script>
</body>
</html>
